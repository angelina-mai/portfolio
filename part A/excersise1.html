<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Excersise 1 </title>

    <script>
        function changeIt(){
            document.getElementById("myParagraph").textContent = "Paragraph changed!";
        }
    </script>
</head>

<body>
    <h1>Excersise 1</h1>
        <p id="myParagraph"> This is my original paragraph.</p>  

        <button onclick="changeIt()">Change paragraph</button>
        
</body>
</html>
